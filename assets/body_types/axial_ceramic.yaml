packages:
  # DIN/IEC standard axial resistor body sizes (DIN 0204..0617).  Sizes are
  # length × diameter in mm — the part of the standard that drives the
  # raster footprint.  Material is "ceramic" as carbon and metal-film
  # resistors both sit in a ceramic-painted shell.
  - id: DIN-0204
    label: "DIN 0204 / R-2 (1/8 W axial)"
    material: ceramic
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: typ
        label: "Typical (1.8 × 3.6 mm)"
        diameter_mm: 1.8
        length_mm: 3.6

  - id: DIN-0207
    label: "DIN 0207 / R-6 (1/4 W axial)"
    material: ceramic
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: S
        label: "Small (2.0 × 5.5 mm)"
        diameter_mm: 2.0
        length_mm: 5.5
      - id: typ
        label: "Typical (2.5 × 6.5 mm)"
        diameter_mm: 2.5
        length_mm: 6.5
      - id: L
        label: "Large (2.8 × 7.5 mm)"
        diameter_mm: 2.8
        length_mm: 7.5

  - id: DIN-0411
    label: "DIN 0411 / R-12 (1/2 W axial)"
    material: ceramic
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.6
    variants:
      - id: S
        label: "Small (3.5 × 9.0 mm)"
        diameter_mm: 3.5
        length_mm: 9.0
      - id: typ
        label: "Typical (4.0 × 11.0 mm)"
        diameter_mm: 4.0
        length_mm: 11.0

  - id: DIN-0617
    label: "DIN 0617 (1 W axial)"
    material: ceramic
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.8
    variants:
      - id: S
        label: "Small (5.0 × 14.0 mm)"
        diameter_mm: 5.0
        length_mm: 14.0
      - id: typ
        label: "Typical (5.5 × 17.0 mm)"
        diameter_mm: 5.5
        length_mm: 17.0

  - id: DIN-0922
    label: "DIN 0922 (2 W axial)"
    material: ceramic
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.8
    variants:
      - id: typ
        label: "Typical (8.0 × 22.0 mm)"
        diameter_mm: 8.0
        length_mm: 22.0
