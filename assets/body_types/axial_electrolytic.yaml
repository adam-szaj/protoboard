packages:
  # Axial electrolytic capacitors — leaded aluminium cans with leads on
  # opposite ends, polar by convention but polarity drawing is the
  # renderer's flavour decision (component_class), not the package's.
  - id: Axial-Elko-D4
    label: "Axial electrolytic, D=4 mm"
    material: metal
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: typ
        label: "Typical (4 × 7 mm)"
        diameter_mm: 4.0
        length_mm: 7.0

  - id: Axial-Elko-D6.3
    label: "Axial electrolytic, D=6.3 mm"
    material: metal
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.6
    variants:
      - id: typ
        label: "Typical (6.3 × 11 mm)"
        diameter_mm: 6.3
        length_mm: 11.0

  - id: Axial-Elko-D10
    label: "Axial electrolytic, D=10 mm"
    material: metal
    lead_arrangement: axial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.8
    variants:
      - id: typ
        label: "Typical (10 × 16 mm)"
        diameter_mm: 10.0
        length_mm: 16.0
