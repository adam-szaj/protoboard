packages:
  # Standard through-hole LED lenses, viewed from above as a coloured
  # circle.  Material is "led_lens" so the renderer can apply the LED
  # palette (bright base + tint set by component_class flavour).
  - id: LED-3mm
    label: "LED T-1 (3 mm)"
    material: led_lens
    lead_arrangement: radial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: typ
        label: "Typical (3 mm dia)"
        diameter_mm: 3.0
        length_mm: 5.6

  - id: LED-5mm
    label: "LED T-1 3/4 (5 mm)"
    material: led_lens
    lead_arrangement: radial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: typ
        label: "Typical (5 mm dia)"
        diameter_mm: 5.0
        length_mm: 8.7

  - id: LED-10mm
    label: "LED 10 mm"
    material: led_lens
    lead_arrangement: radial
    shape: cylinder
    edge: rounded
    lead_diameter_mm: 0.5
    variants:
      - id: typ
        label: "Typical (10 mm dia)"
        diameter_mm: 10.0
        length_mm: 13.6
