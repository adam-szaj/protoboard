<?xml version="1.0" encoding="UTF-8"?>
<!--
  Axial through-hole component (resistor, inductor, fuse).

  Coordinate system: 1 unit = 1 raster (2.54 mm).
  Pin 1 is at (0, 0).  Pin 2 is at (0, N) where N = pin pitch × pin_offset.
  The renderer rotates and translates the entire item to world position.

  Modifiable elements:
    lead-1      line from pin 1 to body — change y2 to adjust lead length
    lead-2      line from pin 2 to body — change y1 to adjust lead length
    body        rounded rect — the component barrel
    pin-1       circle marker at pin 1
    pin-2       circle marker at pin 2
    pin1-marker square marker at pin 1 (overrides pin-1 circle)

  Renderer workflow:
    1. Parse SVG as ElementTree.
    2. Set lead-1 y2 and lead-2 y1 from actual pin_offsets.
    3. Set fill/stroke on body and leads from theme colours.
    4. Set pin-1/pin-2 fill from net colour.
    5. Pass modified XML bytes to QSvgRenderer → QGraphicsSvgItem.
    6. Apply QTransform(translate pin1_world, rotate angle_deg).

  Default geometry: pin 1 at (0,0), pin 2 at (0,4) — 4-raster pitch.
  Body centred at (0, 2), half-length 1.0, half-width 0.2.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-0.5 -0.5 1.0 5.0"
     width="1.0" height="5.0"
     data-pin-count="2"
     data-pin1="0,0"
     data-pin2="0,4"
     data-lead-attach-y1="0.8"
     data-lead-attach-y2="3.2">

  <!-- Lead from pin 1 to body bottom edge -->
  <line id="lead-1"
        x1="0" y1="0"
        x2="0" y2="0.8"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>

  <!-- Lead from pin 2 to body top edge -->
  <line id="lead-2"
        x1="0" y1="3.2"
        x2="0" y2="4"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>

  <!-- Component body: rounded rectangle centred between pins -->
  <rect id="body"
        x="-0.20" y="0.80"
        width="0.40" height="2.40"
        rx="0.10" ry="0.10"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.05"/>

  <!-- Pin 1 square marker (replace pin-1 circle for orientation) -->
  <rect id="pin1-marker"
        x="-0.12" y="-0.12"
        width="0.24" height="0.24"
        fill="#CC2222" stroke="none"/>

  <!-- Pin 2 circle -->
  <circle id="pin-2"
          cx="0" cy="4" r="0.14"
          fill="#CC2222" stroke="none"/>

</svg>
