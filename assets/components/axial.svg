<?xml version="1.0" encoding="UTF-8"?>
<!--
  Axial through-hole component body (resistor, inductor, fuse).

  Units: mm.  1 SVG unit = 1 mm.
  Canvas: 4 × 10 mm  (viewBox "0 0 4 10").
  Body:   3.6 × 9.5 mm, centred in canvas with 0.2 mm margin.

  Renderer reads data-body-width-mm / data-body-height-mm to convert
  mm → raster units.  Leads are drawn in code; this SVG contains only
  the physical body outline.

  Modifiable elements (renderer patches fill/stroke only):
    body   — main barrel rect
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 4 10" width="4" height="10"
     data-body-width-mm="4"
     data-body-height-mm="10">

  <rect id="body"
        x="0.20" y="0.25"
        width="3.60" height="9.50"
        rx="0.50" ry="0.50"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.25"/>

</svg>
