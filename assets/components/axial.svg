<?xml version="1.0" encoding="UTF-8"?>
<!--
  Axial through-hole component (resistor, inductor, fuse).

  Coordinate system: 1 unit = 1 raster (2.54 mm).
  Pin 1 is at SVG (0, 0).  viewBox starts at (0, 0) so that
  QGraphicsSvgItem item-coord (0,0) == SVG (0,0) == pin 1 world position.
  The renderer applies QTransform.translate(pin1_world).rotate(angle).

  Default geometry: 4-raster pitch, body length ~2.0, body width 0.40.
  Pin 2 at (0, 4).  Body centred at (0, 2).

  Modifiable elements:
    lead-1      line from pin 1 to body bottom  — renderer patches y2
    lead-2      line from pin 2 to body top     — renderer patches y1, y2
    body        rounded rect body               — renderer patches fill/stroke/y/height
    pin1-marker square marker at pin 1
    pin-2       circle at pin 2                 — renderer patches cy
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1.0 5.0"
     width="1.0" height="5.0"
     data-pin-count="2"
     data-pin1="0,0"
     data-pin2="0,4"
     data-lead-attach-y1="0.8"
     data-lead-attach-y2="3.2">

  <!-- Lead from pin 1 to body bottom edge -->
  <line id="lead-1"
        x1="0" y1="0"
        x2="0" y2="0.8"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>

  <!-- Lead from pin 2 to body top edge -->
  <line id="lead-2"
        x1="0" y1="3.2"
        x2="0" y2="4"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>

  <!-- Component body: rounded rectangle centred between pins -->
  <rect id="body"
        x="-0.20" y="0.80"
        width="0.40" height="2.40"
        rx="0.10" ry="0.10"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.05"/>

  <!-- Pin 1 square marker -->
  <rect id="pin1-marker"
        x="-0.12" y="-0.12"
        width="0.24" height="0.24"
        fill="#CC2222" stroke="none"/>

  <!-- Pin 2 circle -->
  <circle id="pin-2"
          cx="0" cy="4" r="0.14"
          fill="#CC2222" stroke="none"/>

</svg>
