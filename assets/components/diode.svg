<?xml version="1.0" encoding="UTF-8"?>
<!--
  Axial diode body (DO-35, DO-41, Zener, LED).
  Pin 1 = Anode (A), Pin 2 = Cathode (K).

  Units: mm.  Canvas: 2.5 × 5 mm  (viewBox "0 0 2.5 5").
  Body:  2.2 × 4.7 mm — typical DO-35 barrel.
  Cathode bar: dark stripe at pin-2 end (top 0.6 mm of body).

  Renderer reads data-body-width-mm / data-body-height-mm.
  Leads and pin markers drawn in code.

  Modifiable elements:
    body         — barrel (renderer patches fill/stroke)
    cathode-bar  — dark stripe (renderer leaves fill as-is)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2.5 5" width="2.5" height="5"
     data-body-width-mm="2.5"
     data-body-height-mm="5">

  <rect id="body"
        x="0.15" y="0.15"
        width="2.20" height="4.70"
        rx="0.35" ry="0.35"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.20"/>

  <rect id="cathode-bar"
        x="0.15" y="4.10"
        width="2.20" height="0.60"
        rx="0" ry="0"
        fill="#333333" stroke="none"/>

</svg>
