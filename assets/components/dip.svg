<?xml version="1.0" encoding="UTF-8"?>
<!--
  DIP IC package — parametric template for DIP-N (any even pin count).

  This is a template for DIP-8.  Renderer re-generates the SVG programmatically
  for other pin counts using the same structure.

  Pin layout:
    Left column:  pins 1..n_per_row  at (0, 0), (0, 1), …, (0, n-1)
    Right column: pins n+1..2n       at (rs, n-1), …, (rs, 0)
    rows_spacing (rs) = 3.0 rasters (standard DIP)

  Body spans from (0, -0.5) to (rs, n-0.5).

  Modifiable elements:
    body         main rectangle
    notch        semicircle cutout at pin-1 end (top edge)
    pin-N        circle at each pin (N = 1..2n, net colour)
    pin1-marker  square at pin 1

  Default: DIP-8, n_per_row=4, rows_spacing=3.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-0.5 -0.8 4.0 5.1"
     width="4.0" height="5.1"
     data-pin-count="8"
     data-n-per-row="4"
     data-rows-spacing="3">

  <!--
    Body: rounded rect between rows, with even-odd notch cutout.
    Use a <path> with fill-rule="evenodd" so the notch subtracts.
  -->
  <path id="body"
        fill-rule="evenodd"
        d="M 0.1,-0.5
           L 2.9,-0.5
           Q 3.0,-0.5 3.0,-0.4
           L 3.0, 3.4
           Q 3.0, 3.5 2.9, 3.5
           L 0.1, 3.5
           Q 0.0, 3.5 0.0, 3.4
           L 0.0,-0.4
           Q 0.0,-0.5 0.1,-0.5
           Z
           M 1.5,-0.5
           A 0.25,0.25 0 0,0 1.5,-0.0
           A 0.25,0.25 0 0,0 1.5,-0.5
           Z"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.05"/>

  <!-- Pin 1 square marker -->
  <rect id="pin1-marker"
        x="-0.12" y="-0.12"
        width="0.24" height="0.24"
        fill="#CC2222" stroke="none"/>

  <!-- Left column: pins 1-4 at x=0, y=0..3 -->
  <circle id="pin-1" cx="0" cy="0" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-2" cx="0" cy="1" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-3" cx="0" cy="2" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-4" cx="0" cy="3" r="0.14" fill="#CC2222" stroke="none"/>

  <!-- Right column: pins 5-8 at x=3, y=3..0 -->
  <circle id="pin-5" cx="3" cy="3" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-6" cx="3" cy="2" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-7" cx="3" cy="1" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-8" cx="3" cy="0" r="0.14" fill="#CC2222" stroke="none"/>

</svg>
