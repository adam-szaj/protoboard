<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  DIP IC package — parametric template for DIP-N (any even pin count).

  This is a template for DIP-8.  Renderer re-generates the SVG programmatically
  for other pin counts using the same structure.

  Pin layout:
    Left column:  pins 1..n_per_row  at (0, 0), (0, 1), …, (0, n-1)
    Right column: pins n+1..2n       at (rs, n-1), …, (rs, 0)
    rows_spacing (rs) = 3.0 rasters (standard DIP)

  Body spans from (0, -0.5) to (rs, n-0.5).

  Modifiable elements:
    body         main rectangle
    notch        semicircle cutout at pin-1 end (top edge)
    pin-N        circle at each pin (N = 1..2n, net colour)
    pin1-marker  square at pin 1

  Default: DIP-8, n_per_row=4, rows_spacing=3.
-->

<svg
   viewBox="-0.5 -0.8 4.0 5.1"
   width="4.0"
   height="5.1"
   data-pin-count="8"
   data-n-per-row="4"
   data-rows-spacing="3"
   version="1.1"
   id="svg1"
   sodipodi:docname="dip.svg"
   inkscape:version="1.4.2 (ebf0e940d0, 2025-05-08)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="256"
     inkscape:cx="2"
     inkscape:cy="1.9257812"
     inkscape:window-width="4096"
     inkscape:window-height="1659"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg1" />
  <!--
    Body: rounded rect between rows, with even-odd notch cutout.
    Use a <path> with fill-rule="evenodd" so the notch subtracts.
  -->
  <path
     id="body"
     fill-rule="evenodd"
     d="M 0.10657769,-0.30210426 H 2.9090473 q 0.1000882,0 0.1000882,0.0896169 V 3.1929561 q 0,0.089617 -0.1000882,0.089617 H 0.10657769 q -0.1000882,0 -0.1000882,-0.089617 v -3.40544343 q 0,-0.0896169 0.1000882,-0.0896169 z m 1.40123481,0 a 0.25022052,0.22404234 0 0 0 0,0.44808466 0.25022052,0.22404234 0 0 0 0,-0.44808466 z"
     fill="#ffffc8"
     fill-opacity="0.85"
     stroke="#444444"
     stroke-width="0.047354" />
  <!-- Pin 1 square marker -->
  <rect
     id="pin1-marker"
     x="-0.12"
     y="-0.12"
     width="0.24"
     height="0.24"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <!-- Left column: pins 1-4 at x=0, y=0..3 -->
  <circle
     id="pin-2"
     cx="0"
     cy="1"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <circle
     id="pin-3"
     cx="0"
     cy="2"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <circle
     id="pin-4"
     cx="0"
     cy="3"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <!-- Right column: pins 5-8 at x=3, y=3..0 -->
  <circle
     id="pin-5"
     cx="3"
     cy="3"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <circle
     id="pin-6"
     cx="3"
     cy="2"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <circle
     id="pin-7"
     cx="3"
     cy="1"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
  <circle
     id="pin-8"
     cx="3"
     cy="0"
     r="0.14"
     fill="#CC2222"
     stroke="#FFFFFF" />
</svg>
