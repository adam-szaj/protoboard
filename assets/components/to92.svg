<?xml version="1.0" encoding="UTF-8"?>
<!--
  TO-92 transistor package (3 pins in a row, D-shaped body).

  Pin layout (unrotated): pins at (0,0), (1,0), (2,0) — left to right.
  Body is centred above pin 2 (middle pin).
  D-shape: flat bottom (facing pins), rounded/semicircle top.

  Modifiable elements:
    lead-1   lead from pin 1 to flat body edge
    lead-2   lead from pin 2 to flat body edge
    lead-3   lead from pin 3 to flat body edge
    body     D-shaped path (main package outline)
    pin-1    circle at pin 1
    pin-2    circle at pin 2
    pin-3    circle at pin 3
    pin1-marker  square at pin 1

  data-body-flat-y: Y of the flat (bottom) edge of D-shape.
  data-leads-attach-y: Y where leads connect to body.

  Default: 3 pins at pitch=1, body width=2.4, height=1.4,
           flat edge at y=-0.6, leads from y=0 to y=-0.6.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-0.6 -2.3 3.2 2.8"
     width="3.2" height="2.8"
     data-pin-count="3"
     data-pin1="0,0"
     data-pin2="1,0"
     data-pin3="2,0"
     data-body-flat-y="-0.6"
     data-leads-attach-y="-0.6">

  <!-- Leads from each pin to flat body edge -->
  <line id="lead-1"
        x1="0" y1="0"
        x2="0" y2="-0.6"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>
  <line id="lead-2"
        x1="1" y1="0"
        x2="1" y2="-0.6"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>
  <line id="lead-3"
        x1="2" y1="0"
        x2="2" y2="-0.6"
        stroke="#888888" stroke-width="0.06"
        stroke-linecap="round"/>

  <!--
    D-shape body:
    - flat bottom edge at y = -0.6  (pin side)
    - semicircle top, radius = body_height/2 = 0.7
    - body width = 2.4, centred at x = 1 (middle pin)
    - body spans x: -0.2 to 2.2, y: -0.6 to -2.0
  -->
  <path id="body"
        d="M -0.2,-0.2
           L  2.2,-0.2
           L  2.2,-1.3
           A  1.2,0.7 0 0,1 -0.2,-1.3
           Z"
        fill="#FFFFC8" fill-opacity="0.85"
        stroke="#444444" stroke-width="0.05"/>

  <!-- Pin 1 square marker (orientation indicator) -->
  <rect id="pin1-marker"
        x="-0.12" y="-0.12"
        width="0.24" height="0.24"
        fill="#CC2222" stroke="none"/>

  <!-- Pin circles -->
  <circle id="pin-1" cx="0" cy="1" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-2" cx="1" cy="1" r="0.14" fill="#CC2222" stroke="none"/>
  <circle id="pin-3" cx="2" cy="1" r="0.14" fill="#CC2222" stroke="none"/>

</svg>
