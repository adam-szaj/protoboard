# Package-family catalogue — axial plastic rectifier bodies (DO-15/41/201).
# Ported from assets/body_types/axial_plastic.yaml.  SOD-27 keeps the glass
# colour (DO-35 alternate marking).
families:
  - family: DO-15
    extends: cylinder_axial
    label: "DO-15 (axial plastic, 1A rectifier)"
    color: "#404858"
    default: typ
    variants:
      - id: S
        label: "Small (2.7 x 5.0 mm)"
        dims: {diameter: 2.7, length: 5.0}
        leads: {lead_r: 0.35, lead_length: 7.5}
      - id: typ
        label: "Typical (3.5 x 7.5 mm)"
        dims: {diameter: 3.5, length: 7.5}
        leads: {lead_r: 0.35, lead_length: 11.0}
      - id: L
        label: "Large (4.0 x 9.5 mm)"
        dims: {diameter: 4.0, length: 9.5}
        leads: {lead_r: 0.35, lead_length: 14.0}

  - family: DO-41
    extends: cylinder_axial
    label: "DO-41 (axial plastic, 1A rectifier)"
    color: "#404858"
    default: typ
    variants:
      - id: S
        label: "Small (2.5 x 4.5 mm)"
        dims: {diameter: 2.5, length: 4.5}
        leads: {lead_r: 0.25, lead_length: 6.8}
      - id: typ
        label: "Typical (2.7 x 5.2 mm)"
        dims: {diameter: 2.7, length: 5.2}
        leads: {lead_r: 0.25, lead_length: 7.8}
      - id: L
        label: "Large (3.0 x 6.0 mm)"
        dims: {diameter: 3.0, length: 6.0}
        leads: {lead_r: 0.25, lead_length: 9.0}

  - family: DO-201
    extends: cylinder_axial
    label: "DO-201 (axial plastic, 3A rectifier)"
    color: "#404858"
    default: typ
    variants:
      - id: S
        label: "Small (5.0 x 7.5 mm)"
        dims: {diameter: 5.0, length: 7.5}
        leads: {lead_r: 0.4, lead_length: 11.0}
      - id: typ
        label: "Typical (5.4 x 9.5 mm)"
        dims: {diameter: 5.4, length: 9.5}
        leads: {lead_r: 0.4, lead_length: 14.0}
      - id: L
        label: "Large (6.0 x 11.0 mm)"
        dims: {diameter: 6.0, length: 11.0}
        leads: {lead_r: 0.4, lead_length: 16.0}

  - family: SOD-27
    extends: cylinder_axial
    label: "SOD-27 (DO-35 alternate marking)"
    color: "#f4ece0"
    variants:
      - id: typ
        label: "Typical (1.8 x 3.7 mm)"
        dims: {diameter: 1.8, length: 3.7}
        leads: {lead_r: 0.2, lead_length: 5.6}
