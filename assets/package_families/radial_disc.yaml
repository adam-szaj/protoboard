families:
  - family: c-tht/ceramic-disc
    extends: disc_radial
    label: "Ceramic disc"
    color: "#d6c08c"
    disc_profile: candy
    default: "5"
    variants:
      - id: "5"
        label: "D=5 mm"
        dims: {diameter: 5.0, thickness: 2.0}
        leads: {lead_r: 0.25}
      - id: "7"
        label: "D=7 mm"
        dims: {diameter: 7.0, thickness: 2.5}
        leads: {lead_r: 0.25}
      - id: "10"
        label: "D=10 mm"
        dims: {diameter: 10.0, thickness: 3.0}
        leads: {lead_r: 0.3}
  - family: c-tht/tantalum-drop
    extends: disc_radial
    label: "Tantalum drop"
    color: "#404858"
    disc_profile: candy
    variants:
      - id: "3.5"
        label: "D=3.5 mm"
        dims: {diameter: 3.5, thickness: 2.5}
        leads: {lead_r: 0.2}
