# SPDX-License-Identifier: MIT
# Package-family catalogue — through-hole LED lenses (radial, top-view circle).
# Ported from assets/body_types/radial_led.yaml.  The legacy "led_lens" material
# becomes a bright base colour; the class-flavour tint stays the renderer's job.
families:
  - family: led-tht/round
    extends: cylinder_radial
    label: "LED Plastic Dome"
    color: "#7f7f7f"
    variants:
      - id: "2.5"
        label: "Typical (2.5 mm dia)"
        dims:
          diameter: 2.50
          length: 4.5
          flat_radius: 1.15
          flat_normal: [1.0, 0.0]
        leads:
          body_offset:
              unit: 1.25
              value: [1, 0]
          board_offset: [1, 0]
          lead_r: 0.25
      - id: "3"
        label: "Typical (3 mm dia)"
        dims:
          diameter: 3.0
          length: 5.6
          flat_radius: 1.35
          flat_normal: [1.0, 0.0]
        leads:
          body_offset:
              unit: 2.5
              value: [[1, 0]]
          board_offset: default
          lead_r: 0.25
      - id: "5"
        label: "Typical (5 mm dia)"
        dims:
          diameter: 5.0
          length: 7.2
          flat_radius: 2.35
          flat_normal: [1.0, 0.0]
        leads:
          body_offset:
              unit: 2.5
              value: [[1, 0]]
          board_offset: default
          lead_r: 0.25
