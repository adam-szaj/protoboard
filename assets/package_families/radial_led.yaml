# SPDX-License-Identifier: MIT
# Package-family catalogue — through-hole LED lenses (radial, top-view circle).
# Ported from assets/body_types/radial_led.yaml.  The legacy "led_lens" material
# becomes a bright base colour; the class-flavour tint stays the renderer's job.
families:
  - family: LED-3mm
    extends: cylinder_radial
    label: "LED T-1 (3 mm)"
    color: "#e8e8e8"
    variants:
      - id: typ
        label: "Typical (3 mm dia)"
        dims: {diameter: 3.0, length: 5.6}
        leads: {lead_r: 0.25}

  - family: LED-5mm
    extends: cylinder_radial
    label: "LED T-1 3/4 (5 mm)"
    color: "#e8e8e8"
    variants:
      - id: typ
        label: "Typical (5 mm dia)"
        dims: {diameter: 5.0, length: 8.7}
        leads: {lead_r: 0.25}

  - family: LED-10mm
    extends: cylinder_radial
    label: "LED 10 mm"
    color: "#e8e8e8"
    variants:
      - id: typ
        label: "Typical (10 mm dia)"
        dims: {diameter: 10.0, length: 13.6}
        leads: {lead_r: 0.25}
