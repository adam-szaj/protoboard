# Package-family catalogue — through-hole LED lenses (radial, top-view circle).
# Ported from assets/body_types/radial_led.yaml.  The legacy "led_lens" material
# becomes a bright base colour; the class-flavour tint stays the renderer's job.
families:
  - family: LED
    extends: cylinder_radial
    label: "LED Plastic Dome"
    color: "#7f7f7f"
    variants:
      - id: led25
        label: "Typical (2.5 mm dia)"
        dims:
          diameter: 2.5
          length: 4.5
          flat_radius: 1.22
          flat_normal: [0.0, 1.0]
        leads:
          body_offset:
              unit: 1.25
              value: [[1, 0]]
          board_offset: default
          lead_r: 0.25
      - id: led30
        label: "Typical (3 mm dia)"
        dims:
          diameter: 3.0
          length: 5.6
          flat_radius: 1.45
          flat_normal: [0.0, 1.0]
        leads:
          body_offset:
              unit: 2.5
              value: [[1, 0]]
          board_offset: default
          lead_r: 0.25
      - id: led50
        label: "Typical (5 mm dia)"
        dims:
          diameter: 5.0
          length: 7.2
          flat_radius: 2.45
          flat_normal: [0.0, 1.0]
        leads:
          body_offset:
              unit: 2.5
              value: [[1, 0]]
          board_offset: default
          lead_r: 0.25

