# SPDX-License-Identifier: MIT
families:
  - family: chip-smd/imperial
    extends: prism_smd
    label: "Imperial SMD chip"
    color: "#cdd2d6"
    edge: sharp
    default: "0805"
    variants:
      - id: "0402"
        label: "0402 (1.0 x 0.5 mm)"
        dims: {lx: 1.0, ly: 0.5, lz: 0.35, corner_radius: 0.0}
      - id: "0603"
        label: "0603 (1.6 x 0.8 mm)"
        dims: {lx: 1.6, ly: 0.8, lz: 0.45, corner_radius: 0.0}
      - id: "0805"
        label: "0805 (2.0 x 1.25 mm)"
        dims: {lx: 2.0, ly: 1.25, lz: 0.55, corner_radius: 0.0}
      - id: "1206"
        label: "1206 (3.2 x 1.6 mm)"
        dims: {lx: 3.2, ly: 1.6, lz: 0.6, corner_radius: 0.0}
