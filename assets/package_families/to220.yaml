# SPDX-License-Identifier: MIT
# Package-family catalogue — TO-220 power package (regulators, power MOSFETs).
# A fully-specified prism package (no generator): a flat plastic body with three
# leads inline at the 0.1" raster.  Rendered as a plain radial prism rectangle
# for now — the metal mounting tab is a deferred enhancement (docs/todo.md): it
# would become an optional package feature, like the cylinder's flat side.
#
# Two offset domains (docs/footprints/spec.md), as for TO-92: the leads are 1
# hole apart on the board (``board_offset``, holes) — given explicitly so they
# land on the 2.5 mm raster, not reused from a tighter body pitch.
families:
  - family: TO-220
    extends: prism_radial
    label: "TO-220 (power package, 3-lead inline)"
    color: "#404040"
    edge: rounded
    body_eccentricity: [0, 0.25]
    variants:
      - id: std
        label: "TO-220 (10 x 4.5 mm body)"
        # The ~10 mm body face spans ALONG the 3-lead row (``length``, along the
        # pin axis, ``lx``); the ~4.0 mm thickness is across it (``ly``).  ``lz``
        # is the body depth (unused by the flat top-view rectangle).
        dims: {ly: 4.0, lx: 10.0, lz: 9.5}
        leads:
          direction:   [0, 0, -1]
          body_offset:  {unit: 2.5, value: [[2, [1, 0]]]}  # leads at body: 2.5 mm
          board_offset: default                       # pins on board: 1 hole
          lead_r: 0.3
