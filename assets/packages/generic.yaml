# SPDX-License-Identifier: MIT
# Builtin abstract base packages (see docs/footprints/spec.md).
# These are the parent shapes that the package-family catalogue
# (assets/package_families/) extends; all are abstract (skipped at load).
# Concrete, instantiable bodies live in the family catalogue, not here.
#
# Fields are declared under `schema:` (path-mirrored to the value tree: a value
# at dims.lx is described at schema.dims.lx). A field leaf is
# {type, default?, required?}. Validation is LOOSE — a value with no schema leaf
# (flat_radius, flat_normal, margin, edge_radius, corner_radius, …) passes
# through untouched. See docs/footprints/schema-design.md.
packages:
  # --- abstract root ---
  # The leads.* fields are declared here (path-mirrored, inherited by every
  # descendant via extends-merge). Their richer YAML grammar uses the list /
  # seq / oneof / const TypeSpec constructors — see
  # docs/footprints/leads-schema-proposal.md. An offset element is "bare [x,y]
  # OR run-length {seq: [count, [x,y]]}"; body_offset's {unit,value} wrapper is
  # unwrapped by the loader before validation (proposal §5b), so it is declared
  # as a scalar-or-list only. board_offset adds the 'default'/'solve' sentinels.
  - name: package
    abstract: true
    schema:
      leads:
        direction:
          type:
            oneof:
              - [float, float, float]                          # broadcast
              - {list: [float, float, float]}                  # per-pin
              - {list: {seq: [{list: int}, [float, float, float]]}}  # grouped
        body_offset:
          type:
            oneof:
              - float                                          # scalar sugar
              - [float, float]                                 # single-vector sugar
              - {list: {oneof: [[float, float],                # bare [x,y]
                                {seq: [int, [float, float]]}]}}  # run-length
        board_offset:
          type:
            oneof:
              - {const: default}
              - {const: solve}
              - [float, float]                                 # single-vector sugar
              - {list: {oneof: [[float, float], {seq: [int, [float, float]]}]}}

  # --- abstract base shapes ---
  - name: cylinder
    abstract: true
    extends: package
    shape: cylinder
    schema:
      dims:
        diameter: {type: float, required: true}
        length:   {type: float, required: true}

  - name: prism
    abstract: true
    extends: package
    shape: prism
    # lx/ly/lz are OPTIONAL: a prism with a `margin` derives its bbox from
    # the pin cloud, so these stay un-required (declared for type only).
    # Local-frame axes: lx along the lead axis, ly across it, lz off-board.
    schema:
      dims:
        lx: {type: float}
        ly: {type: float}
        lz: {type: float}

  - name: disc
    abstract: true
    extends: package
    shape: disc
    schema:
      dims:
        diameter:  {type: float, required: true}
        thickness: {type: float, required: true}

  # --- abstract bazy z geometrią wyprowadzeń ---
  - name: cylinder_axial            # rezystor, dioda osiowa
    abstract: true
    extends: cylinder
    leads:
      direction:   [[0, 0, -1], [0, 0, 1]]
      body_offset: 0
      board_offset: solve
      lead_length: null
      lead_r:      null
      body_eccentricity: 0.0

  - name: cylinder_radial           # elektrolit, LED (top-view)
    abstract: true
    extends: cylinder
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_dil                 # DIP — rigid, w dół
    abstract: true
    extends: prism
    leads:
      direction:    [0, 0, -1]
      board_offset: default
    bend: 0.0

  - name: disc_radial               # ceramiczny kondensator dyskowy
    abstract: true
    extends: disc
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_radial              # kryształ HC-49, ceramiczna cegła
    abstract: true
    extends: prism
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_smd                 # SMD chip (0805 / 0603) — flat, no leads
    abstract: true                  # leży na dwóch sąsiednich padach, nie
    extends: prism                  # zasłania otworu (body_blocks=False)
    arrangement: axial              # terminale na końcach wzdłuż osi body
    mount: surface                  # montaż na padach: pin 2 na dowolnym
                                    # sąsiednim padzie (ortho lub diag), nie
                                    # sztywno w jednym otworze
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  # This file carries ONLY the abstract base shapes above — they are the parents
  # that the package-family catalogue (assets/package_families/) extends, and are
  # load-bearing for production (a missing base fails family loading at startup).
  #
  # No named (instantiable) packages live here. They used to (TO-92, DO-35,
  # R_Axial_DIN0207, CP_Elec_6.3x11, DIP-8) but every placed part resolves its
  # body through the package-family catalogue via ``footprints: [ref]``; the
  # generic copies were dead in production (tests only) and some had drifted, so
  # they were removed. Concrete bodies belong in package_families/. See
  # docs/todo.md.
