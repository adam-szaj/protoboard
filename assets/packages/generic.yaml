# SPDX-License-Identifier: MIT
# Builtin generic + named packages (see docs/footprints/spec.md).
# Abstract bases are skipped at load; named packages below are instantiable.
packages:
  # --- abstract bryły bazowe ---
  - name: cylinder
    abstract: true
    shape: cylinder
    dims: {diameter: null, length: null, edge_radius: 0.0}

  - name: prism
    abstract: true
    shape: prism

  # --- abstract bazy z geometrią wyprowadzeń ---
  - name: cylinder_axial            # rezystor, dioda osiowa
    abstract: true
    extends: cylinder
    leads:
      direction:   [[0, 0, -1], [0, 0, 1]]
      body_offset: 0
      board_offset: solve
      lead_length: null
      lead_r:      null
      body_eccentricity: 0.0

  - name: cylinder_radial           # elektrolit, LED (top-view)
    abstract: true
    extends: cylinder
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_dil                 # DIP — rigid, w dół
    abstract: true
    extends: prism
    leads:
      direction:    [0, 0, -1]
      board_offset: default
    bend: 0.0

  - name: disc                      # ceramiczny dysk, button cell
    abstract: true
    shape: disc
    dims: {diameter: null, thickness: null}

  - name: disc_radial               # ceramiczny kondensator dyskowy
    abstract: true
    extends: disc
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_radial              # kryształ HC-49, ceramiczna cegła
    abstract: true
    extends: prism
    arrangement: radial
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  - name: prism_smd                 # SMD chip (0805 / 0603) — flat, no leads
    abstract: true                  # leży na dwóch sąsiednich padach, nie
    extends: prism                  # zasłania otworu (body_blocks=False)
    arrangement: axial              # terminale na końcach wzdłuż osi body
    mount: surface                  # montaż na padach: pin 2 na dowolnym
                                    # sąsiednim padzie (ortho lub diag), nie
                                    # sztywno w jednym otworze
    leads:
      direction:    [[0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 2.5, value: [[1, 0]]}
      board_offset: default
    bend: 0.0

  # --- named (instantiable) ---
  - name: DO-35
    extends: cylinder_axial
    description: "Glass axial diode body"
    dims: {diameter: 2.0, length: 4.0}
    leads: {lead_r: 0.27, lead_length: 24.0}

  - name: R_Axial_DIN0207
    extends: cylinder_axial
    description: "Axial resistor body, DIN 0207 (~1/4 W)"
    dims: {diameter: 2.5, length: 6.3}
    leads: {lead_r: 0.27, lead_length: 32.0}

  - name: CP_Elec_6.3x11
    extends: cylinder_radial
    description: "Radial electrolytic capacitor, 6.3x11 mm"
    dims: {diameter: 6.3, length: 11.0}
    leads:
      body_offset: {unit: 2.5, value: [[1, 0]]}
    bend: 4.0

  - name: TO-92
    extends: prism
    description: "Plastic transistor, 3-lead inline"
    dims: {width: 4.5, length: 4.5, height: 5.2}
    leads:
      direction:   [[0, 0, -1], [0, 0, -1], [0, 0, -1]]
      body_offset:  {unit: 1.25, value: [[1, 0], [1, 0]]}
      board_offset: default
    bend: 3.54

  - name: DIP-8
    extends: prism_dil
    description: "DIP-8 / DIL-8, 0.3 inch rows"
    # Body narrower than the 0.3in row spacing so the legs show on both sides;
    # length runs a little past the end pins.  (width 4.96 / length 10.04 mm.)
    dims: {width: 4.96, length: 10.04, height: 4.0}
    leads:
      body_offset:
        unit: 2.5
        value: [[3, [0, 1]], [3, 0], [3, [0, -1]]]
