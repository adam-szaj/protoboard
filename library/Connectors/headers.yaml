components:
  # -----------------------------------------------------------------------
  # Parametric connectors — the entry declares only its package kind; the pin
  # count (and the header's row count) are chosen by the user at placement
  # time (variable pin count).  The chosen parameters synthesize a concrete
  # definition under the historical catalogue name (PinHeader_1x05,
  # JST_XH_4pin), so existing projects keep resolving.  Pin-name presets
  # (UART/I2C/SPI/…) will return as generator-side configuration per
  # pin-count — deliberately NOT authored here.
  # -----------------------------------------------------------------------

- name: PinHeader
  component_class: connector
  package: {kind: pin_header}
  description: "Pin header 2.54mm — 1×N / 2×N, count chosen at placement"

- name: JST_PH
  component_class: connector
  package: {kind: jst}
  description: "JST PH (2.0mm pitch, through-hole) — count chosen at placement"

- name: JST_XH
  component_class: connector
  package: {kind: jst}
  description: "JST XH (2.5mm pitch, through-hole) — count chosen at placement"

  # -----------------------------------------------------------------------
  # Screw terminals (5.08mm pitch — 2 raster units).  Kept on the explicit SIL
  # footprint: the wide 2-unit pitch is not the connector kind's 0.1" raster.
  # -----------------------------------------------------------------------

- name: Screw_Term_1x02
  component_class: connector
  package:
    shape: prism
      # 2-hole (5.08 mm) screw-terminal pitch — no generator kind takes
      # a pitch, so the body is declared explicitly.
    leads:
      direction: [0, 0, -1]
      body_offset: {unit: 2.5, value: [[0, 2]]}
      board_offset: default
    bend: 0
  description: "2-pin screw terminal 5.08mm"

  meta_pins:
  - +
  - '-'
  pin_map:
    1:
    - 1
    2:
    - 2
- name: Screw_Term_1x03
  component_class: connector
  package:
    shape: prism
    leads:
      direction: [0, 0, -1]
      body_offset: {unit: 2.5, value: [[2, [0, 2]]]}
      board_offset: default
    bend: 0
  description: "3-pin screw terminal 5.08mm"
  meta_pins:
  - '1'
  - '2'
  - '3'
  pin_map:
    1:
    - 1
    2:
    - 2
    3:
    - 3
