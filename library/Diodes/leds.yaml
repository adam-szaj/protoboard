components:
  # -----------------------------------------------------------------------
  # Templates per LED package size
  # -----------------------------------------------------------------------
  - name: _LED_2_5mm
    component_class: diode_led
    pin_names:
      1: A
      2: K
    package_family_ref: LED/led25
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 7
        default:
          x: 0
          y: 1
  - name: _LED_3_0mm
    component_class: diode_led
    pin_names:
      1: A
      2: K
    package_family_ref: LED/led30
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 7
        default:
          x: 0
          y: 1
  - name: _LED_5_0mm
    component_class: diode_led
    pin_names:
      1: A
      2: K
    package_family_ref: LED/led50
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 9
        default:
          x: 0
          y: 1
          # -----------------------------------------------------------------------
          # 2.5 mm LEDs by colour
          # -----------------------------------------------------------------------
  - name: LED_2_5_Red
    extends: _LED_2_5mm
    style: 'color: #ff000080'
    description: LED 2.5mm red
  - name: LED_2_5_Green
    extends: _LED_2_5mm
    style: 'color: #00ff0080'
    description: LED 2.5mm green
  - name: LED_2_5_Yellow
    extends: _LED_2_5mm
    style: 'color: #dddd0080'
    description: LED 2.5mm yellow
  - name: LED_2_5_Blue
    extends: _LED_2_5mm
    style: 'color: #0000ff80'
    description: LED 2.5mm blue
  - name: LED_2_5_White
    extends: _LED_2_5mm
    style: 'color: #ffffff80'
    description: LED 2.5mm white
    # -----------------------------------------------------------------------
    # 3 mm LEDs by colour
    # -----------------------------------------------------------------------
  - name: LED_3_0_Red
    extends: _LED_3_0mm
    style: 'color: #ff000080'
    description: LED 3mm red
  - name: LED_3_0_Green
    extends: _LED_3_0mm
    style: 'color: #00ff0080'
    description: LED 3mm green
  - name: LED_3_0_Yellow
    extends: _LED_3_0mm
    style: 'color: #dddd0080'
    description: LED 3mm yellow
  - name: LED_3_0_Blue
    extends: _LED_3_0mm
    style: 'color: #0000ff80'
    description: LED 3mm blue
  - name: LED_3_0_White
    extends: _LED_3_0mm
    style: 'color: #ffffff80'
    description: LED 3mm white
    # -----------------------------------------------------------------------
    # 5 mm LEDs by colour (the most common form)
    # -----------------------------------------------------------------------
  - name: LED_5_0_Red
    extends: _LED_5_0mm
    style: 'color: #ff000080'
    description: LED 5mm red
  - name: LED_5_0_Green
    extends: _LED_5_0mm
    style: 'color: #00ff0080'
    description: LED 5mm green
  - name: LED_5_0_Yellow
    extends: _LED_5_0mm
    style: 'color: #dddd0080'
    description: LED 5mm yellow
  - name: LED_5_0_Blue
    extends: _LED_5_0mm
    style: 'color: #0000ff80'
    description: LED 5mm blue
  - name: LED_5_0_White
    extends: _LED_5_0mm
    style: 'color: #ffffff80'
    description: LED 5mm white
  - name: LED_BAR
    component_class: led_bar
    description: "10-segment LED bar graph"
    pins: {count: 20}
    pin_names: {1: A1, 2: A2, 3: A3, 4: A4, 5: A5, 6: A6, 7: A7, 8: A8, 9: A9,
                10: A10, 11: K1, 12: K2, 13: K3, 14: K4, 15: K5, 16: K6, 17: K7,
                18: K8, 19: K9, 20: K10}
    package:
      shape: prism
      dims:
        width: 10
        length: 25.4
        height: 8
      leads:
        direction: [0, 0, -1]
        # 20 pins: down the anode column (9 steps), jump across, back up the
        # cathode column — cumulative pin-to-pin offsets, unit = 2.5 mm.
        body_offset:
          unit: 2.5
          value:
            - [9, [0, 1]]
            - [3, 0]
            - [9, [0, -1]]
        board_offset: default
