components:
  # -----------------------------------------------------------------------
  # Templates per LED package size
  # -----------------------------------------------------------------------
- name: _LED
  component_class: diode_led
  pins:
    meta:
    - A
    - K
- name: _LED_2_5mm
  extends: _LED
  package_options:
  - ref: "@led-tht/round/2.5"
    pins:
      map:
        1:
        - 1
        2:
        - 2
- name: _LED_3_0mm
  extends: _LED
  package_options:
  - ref: "@led-tht/round/3"
    pins:
      map:
        1:
        - 1
        2:
        - 2
- name: _LED_5_0mm
  extends: _LED
  package_options:
  - ref: "@led-tht/round/5"
    pins:
      map:
        1:
        - 1
        2:
        - 2
- name: LED_2_5_Red
  extends: _LED_2_5mm
  style: 'color: #ff000080'
  description: LED 2.5mm red
- name: LED_2_5_Green
  extends: _LED_2_5mm
  style: 'color: #00ff0080'
  description: LED 2.5mm green
- name: LED_2_5_Yellow
  extends: _LED_2_5mm
  style: 'color: #dddd0080'
  description: LED 2.5mm yellow
- name: LED_2_5_Blue
  extends: _LED_2_5mm
  style: 'color: #0000ff80'
  description: LED 2.5mm blue
- name: LED_2_5_White
  extends: _LED_2_5mm
  style: 'color: #ffffff80'
  description: LED 2.5mm white
    # -----------------------------------------------------------------------
    # 3 mm LEDs by colour
    # -----------------------------------------------------------------------
- name: LED_3_0_Red
  extends: _LED_3_0mm
  style: 'color: #ff000080'
  description: LED 3mm red
- name: LED_3_0_Green
  extends: _LED_3_0mm
  style: 'color: #00ff0080'
