components:
  # -----------------------------------------------------------------------
  # Templates per LED package size
  # -----------------------------------------------------------------------
  - name: _LED_2_5mm
    component_class: diode_led
    footprint: {type: TwoPin}
    pin_names: {1: A, 2: K}
    package_family_ref: "LED/led25"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 7
        default: {x: 0, y: 1}

  - name: _LED_3_0mm
    component_class: diode_led
    footprint: {type: TwoPin}
    pin_names: {1: A, 2: K}
    package_family_ref: "LED/led30"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 7
        default: {x: 0, y: 1}

  - name: _LED_5_0mm
    component_class: diode_led
    footprint: {type: TwoPin}
    pin_names: {1: A, 2: K}
    package_family_ref: "LED/led50"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 9
        default: {x: 0, y: 1}

  # -----------------------------------------------------------------------
  # 2.5 mm LEDs by colour
  # -----------------------------------------------------------------------

  - name: LED_2_5_Red
    extends: _LED_2_5mm
    style: "color: #ff000080"
    description: "LED 2.5mm red"

  - name: LED_2_5_Green
    extends: _LED_2_5mm
    style: "color: #00ff0080"
    description: "LED 2.5mm green"

  - name: LED_2_5_Yellow
    extends: _LED_2_5mm
    style: "color: #dddd0080"
    description: "LED 2.5mm yellow"

  - name: LED_2_5_Blue
    extends: _LED_2_5mm
    style: "color: #0000ff80"
    description: "LED 2.5mm blue"

  - name: LED_2_5_White
    extends: _LED_2_5mm
    style: "color: #ffffff80"
    description: "LED 2.5mm white"

  # -----------------------------------------------------------------------
  # 3 mm LEDs by colour
  # -----------------------------------------------------------------------

  - name: LED_3_0_Red
    extends: _LED_3_0mm
    style: "color: #ff000080"
    description: "LED 3mm red"

  - name: LED_3_0_Green
    extends: _LED_3_0mm
    style: "color: #00ff0080"
    description: "LED 3mm green"

  - name: LED_3_0_Yellow
    extends: _LED_3_0mm
    style: "color: #dddd0080"
    description: "LED 3mm yellow"

  - name: LED_3_0_Blue
    extends: _LED_3_0mm
    style: "color: #0000ff80"
    description: "LED 3mm blue"

  - name: LED_3_0_White
    extends: _LED_3_0mm
    style: "color: #ffffff80"
    description: "LED 3mm white"

  # -----------------------------------------------------------------------
  # 5 mm LEDs by colour (the most common form)
  # -----------------------------------------------------------------------

  - name: LED_5_0_Red
    extends: _LED_5_0mm
    style: "color: #ff000080"
    description: "LED 5mm red"

  - name: LED_5_0_Green
    extends: _LED_5_0mm
    style: "color: #00ff0080"
    description: "LED 5mm green"

  - name: LED_5_0_Yellow
    extends: _LED_5_0mm
    style: "color: #dddd0080"
    description: "LED 5mm yellow"

  - name: LED_5_0_Blue
    extends: _LED_5_0mm
    style: "color: #0000ff80"
    description: "LED 5mm blue"

  - name: LED_5_0_White
    extends: _LED_5_0mm
    style: "color: #ffffff80"
    description: "LED 5mm white"

