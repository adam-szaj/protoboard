components:
  # -----------------------------------------------------------------------
  # Templates (prefix _ → not placeable)
  # -----------------------------------------------------------------------

  - name: _D_DO35
    component_class: diode
    pin_names: {1: A, 2: K}
    package_family_ref: "DO-35/typ"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 11
        default: {x: 0, y: 2}
    aliases:
      - D_DO_35_SOD27
      - D_DO35_SOD27

  - name: _D_DO41
    component_class: diode
    pin_names: {1: A, 2: K}
    package_family_ref: "DO-41/typ"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 17
        default: {x: 0, y: 3}
    aliases:
      - D_DO_201
      - D_DO41

  - name: _D_DO201
    component_class: diode
    pin_names: {1: A, 2: K}
    package_family_ref: "DO-201/typ"
    bendable_pins:
      2:
        min_reach: 2
        max_reach: 17
        default: {x: 0, y: 4}

  # -----------------------------------------------------------------------
  # Rectifier / switching / Schottky diodes
  # -----------------------------------------------------------------------

  - name: 1N4148
    extends: _D_DO35
    description: "Small signal switching diode, 100V 200mA"

  - name: 1N4001
    extends: _D_DO41
    description: "Rectifier diode, 50V 1A"

  - name: 1N4007
    extends: _D_DO41
    description: "Rectifier diode, 1000V 1A"

  - name: 1N5408
    extends: _D_DO201
    description: "Rectifier diode, 1000V 3A"

  - name: 1N5819
    extends: _D_DO41
    description: "Schottky diode, 40V 1A"

  - name: BAT43
    extends: _D_DO35
    description: "Schottky signal diode, 30V 200mA"

  - name: BAT85
    extends: _D_DO35
    description: "Schottky signal diode, 30V 200mA, low VF"
