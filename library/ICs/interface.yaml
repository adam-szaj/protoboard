components:
  - name: MAX232
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "RS-232 dual driver/receiver, 5V single supply"
    pin_names:
      1: C1+
      2: VS+
      3: C1-
      4: C2+
      5: C2-
      6: VS-
      7: T2OUT
      8: R2IN
      9: R2OUT
      10: T2IN
      11: T1IN
      12: R1OUT
      13: R1IN
      14: T1OUT
      15: GND
      16: VCC

  - name: ULN2003
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "7-channel Darlington transistor array"
    pin_names:
      1: IN1
      2: IN2
      3: IN3
      4: IN4
      5: IN5
      6: IN6
      7: IN7
      8: GND
      9: COM
      10: OUT7
      11: OUT6
      12: OUT5
      13: OUT4
      14: OUT3
      15: OUT2
      16: OUT1

  - name: L293D
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "Dual H-bridge motor driver, 600mA"
    pin_names:
      1: EN1
      2: IN1
      3: OUT1
      4: GND
      5: GND
      6: OUT2
      7: IN2
      8: VCC2
      9: EN2
      10: IN3
      11: OUT3
      12: GND
      13: GND
      14: OUT4
      15: IN4
      16: VCC1

  - name: PC817
    component_class: ic
    pins: {count: 4}
    package: {kind: dip_ic}
    description: "Single optocoupler, CTR 50-300%"
    pin_names:
      1: A
      2: K
      3: E
      4: C
