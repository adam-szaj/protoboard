components:
  # -----------------------------------------------------------------------
  # 74xx series, DIP packages
  # Standard supply: pin 7 = GND, pin 14 = VCC (DIP-14)
  #                  pin 8 = GND, pin 16 = VCC (DIP-16)
  # -----------------------------------------------------------------------

  # -----------------------------------------------------------------------
  # Gates
  # -----------------------------------------------------------------------

  - name: 74HC00
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Quad 2-input NAND gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: A2
      5: B2
      6: Y2
      7: GND
      8: Y3
      9: A3
      10: B3
      11: Y4
      12: A4
      13: B4
      14: VCC

  - name: 74HC02
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Quad 2-input NOR gate"
    pin_names:
      1: Y1
      2: A1
      3: B1
      4: Y2
      5: A2
      6: B2
      7: GND
      8: Y3
      9: A3
      10: B3
      11: Y4
      12: A4
      13: B4
      14: VCC

  - name: 74HC04
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Hex inverter"
    pin_names:
      1: A1
      2: Y1
      3: A2
      4: Y2
      5: A3
      6: Y3
      7: GND
      8: Y4
      9: A4
      10: Y5
      11: A5
      12: Y6
      13: A6
      14: VCC

  - name: 74HC08
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Quad 2-input AND gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: A2
      5: B2
      6: Y2
      7: GND
      8: Y3
      9: A3
      10: B3
      11: Y4
      12: A4
      13: B4
      14: VCC

  - name: 74HC32
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Quad 2-input OR gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: A2
      5: B2
      6: Y2
      7: GND
      8: Y3
      9: A3
      10: B3
      11: Y4
      12: A4
      13: B4
      14: VCC

  - name: 74HC86
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Quad 2-input XOR gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: A2
      5: B2
      6: Y2
      7: GND
      8: Y3
      9: A3
      10: B3
      11: Y4
      12: A4
      13: B4
      14: VCC

  # -----------------------------------------------------------------------
  # Flip-flops / latches
  # -----------------------------------------------------------------------

  - name: 74HC74
    component_class: ic
    pins: {count: 14}
    package: {kind: dip_ic}
    description: "Dual D flip-flop with Set/Reset"
    pin_names:
      1: NR1
      2: D1
      3: CLK1
      4: NS1
      5: Q1
      6: NQ1
      7: GND
      8: NQ2
      9: Q2
      10: NS2
      11: CLK2
      12: D2
      13: NR2
      14: VCC

  - name: 74HC373
    description: "Octal D latch (3-state)"
    component_class: ic
    pins: {count: 20}
    package: {kind: dip_ic}
    pin_names:
      1: OE
      2: D1
      3: Q1
      4: D2
      5: Q2
      6: D3
      7: Q3
      8: D4
      9: Q4
      10: GND
      11: Q5
      12: D5
      13: Q6
      14: D6
      15: Q7
      16: D7
      17: Q8
      18: D8
      19: LE
      20: VCC

  # -----------------------------------------------------------------------
  # Counters / registers
  # -----------------------------------------------------------------------

  - name: 74HC163
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "4-bit synchronous binary counter"
    pin_names:
      1: NR
      2: CLK
      3: A
      4: B
      5: C
      6: D
      7: ENP
      8: GND
      9: LOAD
      10: ENT
      11: QD
      12: QC
      13: QB
      14: QA
      15: RCO
      16: VCC

  - name: 74HC595
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "8-bit shift register with output latches"
    pin_names:
      1: Q1
      2: Q2
      3: Q3
      4: Q4
      5: Q5
      6: Q6
      7: Q7
      8: GND
      9: Q7S
      10: SRCLR
      11: SRCLK
      12: RCLK
      13: OE
      14: SER
      15: Q0
      16: VCC

  # -----------------------------------------------------------------------
  # Buffers / drivers
  # -----------------------------------------------------------------------

  - name: 74HC245
    description: "Octal bus transceiver (3-state)"
    component_class: ic
    pins: {count: 20}
    package: {kind: dip_ic}
    pin_names:
      1: DIR
      2: A1
      3: A2
      4: A3
      5: A4
      6: A5
      7: A6
      8: A7
      9: A8
      10: GND
      11: B8
      12: B7
      13: B6
      14: B5
      15: B4
      16: B3
      17: B2
      18: B1
      19: OE
      20: VCC

  # -----------------------------------------------------------------------
  # Comparators / decoders
  # -----------------------------------------------------------------------

  - name: 74HC138
    component_class: ic
    pins: {count: 16}
    package: {kind: dip_ic}
    description: "3-to-8 line decoder/demultiplexer"
    pin_names:
      1: A
      2: B
      3: C
      4: NE2
      5: NE3
      6: E1
      7: Y7
      8: GND
      9: Y6
      10: Y5
      11: Y4
      12: Y3
      13: Y2
      14: Y1
      15: Y0
      16: VCC

  - name: 74HC244
    description: "Octal buffer/line driver (3-state)"
    component_class: ic
    pins: {count: 20}
    package: {kind: dip_ic}
    pin_names:
      1: OE1
      2: A1
      3: Y2
      4: A2
      5: Y3
      6: A3
      7: Y4
      8: A4
      9: Y5
      10: GND
      11: A5
      12: Y6
      13: A6
      14: Y7
      15: A7
      16: Y8
      17: A8
      18: OE2
      19: Y1
      20: VCC
