components:
  # -----------------------------------------------------------------------
  # Templates
  # -----------------------------------------------------------------------

- name: _TO92_3
  component_class: ic
  package_options:
  - {name: TO92, ref: "@q-tht/TO-92", pins: {map: {1: [1], 2: [2], 3: [3]}}}
  pins:
    meta: [P1, P2, P3]

- name: _TO220_3
  component_class: ic
  package_options:
  - {name: TO220, ref: "@q-tht/TO-220", pins: {map: {1: [1], 2: [2], 3: [3]}}}
  pins:
    meta: [P1, P2, P3]

  # -----------------------------------------------------------------------
  # Linear regulators — 78xx / 79xx (TO-220, pinout: 1=IN, 2=GND, 3=OUT)
  # -----------------------------------------------------------------------

- name: _78xx
  extends: _TO220_3
  pins:
    meta:
    - IN
    - GND
    - OUT

- name: _79xx
  extends: _TO220_3
  pins:
    meta:
    - IN
    - GND
    - OUT

- name: '7805'
  extends: _78xx
  description: "+5V 1A linear regulator"

- name: '7809'
  extends: _78xx
  description: "+9V 1A linear regulator"

- name: '7812'
  extends: _78xx
  description: "+12V 1A linear regulator"

- name: '7815'
  extends: _78xx
  description: "+15V 1A linear regulator"

- name: '7905'
  extends: _79xx
  description: "-5V 1A linear regulator"

- name: '7912'
  extends: _79xx
  description: "-12V 1A linear regulator"

  # -----------------------------------------------------------------------
  # Adjustable regulators
  # -----------------------------------------------------------------------

- name: LM317
  extends: _TO220_3
  description: "Adjustable +1.25..37V 1.5A linear regulator"

  pins:
    meta:
    - ADJ
    - OUT
    - IN
- name: LM337
  extends: _TO220_3
  description: "Adjustable -1.25..-37V 1.5A linear regulator"

  # -----------------------------------------------------------------------
  # Low-dropout (SOT-89 / TO-92 compatible)
  # -----------------------------------------------------------------------

  pins:
    meta:
    - ADJ
    - OUT
    - IN
- name: LM78L05
  extends: _TO92_3
  description: "+5V 100mA LDO (TO-92)"

  pins:
    meta:
    - OUT
    - GND
    - IN
- name: LM78L33
  extends: _TO92_3
  description: "+3.3V 100mA LDO (TO-92)"

  pins:
    meta:
    - OUT
    - GND
    - IN
- name: TL431
  description: "Programable Zener Diode IC"
  component_class: ic
  package_options:
  - {name: TO92, ref: "@q-tht/TO-92/std", pins: {map: {1: [1], 2: [2], 3: [3]}}}
  pins:
    meta:
    - Ref
    - A
    - K
