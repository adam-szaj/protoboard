components:
  # Modules / development boards
  # -----------------------------------------------------------------------

  - name: Arduino_Nano
    description: "Arduino Nano v3 (30-pin: 15 per side, 18mm wide)"
    component_class: devboard
    # PCB module: real outline (18 × 38.1 mm) + pins as aggregated offsets.
    # 2×15 header: 14 steps down the left column, jump 7 across, 14 up the right.
    package:
      shape: prism
      dims: {width: 18.0, length: 38.1, height: 1.6}
      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[14, [0, 1]], [7, 0], [14, [0, -1]]]}
        board_offset: default
      bend: 0
    pin_names:
      1: PD1/TX/PCINT17/31
      2: PD0/RX/PCINT16/30
      3: PC6/RST/PCINT14/29
      4: GND
      5: PD2/INT0/PCINT18/32
      6: PD3/INT1/PCINT19/OC2B/1
      7: PD4/T0/PCINT20/XCK/2
      8: PD5/T1/PCINT21/OC0B/9
      9: PD6/AIN0/PCINT22/OC0A/10
      10: D7
      11: D8
      12: D9/PWM
      13: D10/PWM/SS
      14: D11/PWM/MOSI
      15: D12/MISO
      16: D13/SCK
      17: 3V3
      18: AREF
      19: A0
      20: A1
      21: A2
      22: A3
      23: A4/SDA
      24: A5/SCL
      25: A6
      26: A7
      27: 5V
      28: RST
      29: GND
      30: VIN
    aliases:
      - Arduino_Nano_WithMountingHoles

  # STM32 BluePill (STM32F103C8T6)
  # PCB: 53mm × 22.86mm, 2×20 pins, pitch 2.54mm, rows_spacing 8 (20.32mm)
  # Pinout: left col top→bottom = pins 1-20, right col bottom→top = pins 21-40.
  # Pin 1 = VBAT (top-left), matches standard WeAct/RobotDyn silkscreen.
  - name: STM32_BluePill
    description: "STM32F103C8T6 Blue Pill module (2×20, 20.32mm wide)"
    component_class: devboard
    # PCB module: real outline (22.86 × 53 mm) + pins as aggregated offsets.
    # 2×20 header: 19 steps down the left column, jump 6 across, 19 up the right.
    package:
      shape: prism
      dims: {width: 22.86, length: 53.0, height: 1.6}
      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[19, [0, 1]], [6, 0], [19, [0, -1]]]}
        board_offset: default
      bend: 0
    pin_names:
      1: VBAT
      2: PC13
      3: PC14
      4: PC15
      5: PA0
      6: PA1
      7: PA2
      8: PA3
      9: PA4
      10: PA5
      11: PA6
      12: PA7
      13: PB0
      14: PB1
      15: PB10
      16: PB11
      17: NRST
      18: 3V3
      19: GND
      20: GND
      21: 3V3
      22: GND
      23: 5V
      24: PB9
      25: PB8
      26: PB7
      27: PB6
      28: PB5
      29: PB4
      30: PB3
      31: PA15
      32: PA12
      33: PA11
      34: PA10
      35: PA9
      36: PA8
      37: PB15
