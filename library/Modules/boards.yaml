  # WeAct STM32G431/G474 CoreBoard
  # PCB: ~53mm × 28mm, 4×20 pins, col_spacings [1, 8, 1] (2.54, 20.32, 2.54 mm)
  # Pinout: L_outer(1-20)↓, L_inner(21-40)↓, R_inner(41-60)↑, R_outer(61-80)↑
  # WeAct Studio v1.0 schematic. G431CB/RB and G474CE/RE use the same board layout.
  - name: STM32G4_WeAct
    description: "WeAct STM32G431/G474 CoreBoard (4×20, col_spacings [1,8,1])"
    component_class: devboard
    # PCB module: real outline (28 × 53 mm) + pins as aggregated offsets.
    # 4 columns at x = 0,1,9,10: L_outer↓ (1-20), jump to L_inner↓ (21-40),
    # jump to R_inner↑ (41-60), jump to R_outer↑ (61-80).  The within-column
    # runs are 19 steps; the three [Δx, Δy] vectors are the column jumps.
    package:
      shape: prism
      dims: {width: 28.0, length: 53.0, height: 1.6}
      leads:
        direction: [0, 0, -1]
        body_offset:
          unit: 2.5
          value:
            - [19, [0, 1]]    # L_outer (x=0): pin 1→20 down
            - [1, -19]        # jump to L_inner top (x=1, y=0)
            - [19, [0, 1]]    # L_inner (x=1): pin 21→40 down
            - [8, 0]          # jump to R_inner bottom (x=9, y=19)
            - [19, [0, -1]]   # R_inner (x=9): pin 41→60 up
            - [1, 19]         # jump to R_outer bottom (x=10, y=0… then up)
            - [19, [0, -1]]   # R_outer (x=10): pin 61→80 up
        board_offset: default
      bend: 0
    pin_names:
      # L_outer (col 0), pins 1-20, top→bottom
      1: VBAT
      2: PC13
      3: PC14
      4: PC15
      5: PF0
      6: PF1
      7: NRST
      8: PC0
      9: PC1
      10: PC2
      11: PC3
      12: PA0
      13: PA1
      14: PA2
      15: PA3
      16: PF2
      17: PA4
      18: PA5
      19: PA6
      20: PA7
      # L_inner (col 1), pins 21-40, top→bottom
      21: 3V3
      22: 3V3
      23: BOOT0
      24: SWDIO
      25: SWDCLK
      26: PB3/SWO
      27: GND
      28: GND
      29: PB4
      30: PB5
      31: PB6
      32: PB7
      33: PB8
      34: PB9
      35: GND
      36: GND
      37: 5V
      38: 5V
      39: VBUS
      40: GND
      # R_inner (col 2, x=9), pins 41-60, bottom→top
      41: PB14
      42: PB15
      43: PA8
      44: PA9
      45: PA10
      46: PA11
      47: PA12
      48: PA13
      49: PA14
      50: PA15
      51: PB3
      52: PB4
      53: PB5
      54: PB6
      55: PB7
      56: PB8
      57: PB9
      58: PB10
      59: PB11
      60: PB12
      # R_outer (col 3, x=10), pins 61-80, bottom→top
      61: PC6
      62: PC7
      63: PC8
      64: PC9
      65: PC10
      66: PC11
      67: PC12
      68: PD2
      69: PE0
      70: PE1
      71: PE2
      72: PE3
      73: PE4
      74: PE5
      75: PE6
      76: PE7
      77: PE8
      78: PE9
      79: PE10
      80: PE11
    aliases:
      - STM32G431_WeAct
      - STM32G474_WeAct
