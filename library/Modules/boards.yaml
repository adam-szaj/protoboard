      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[19, [0, 1]], [6, 0], [19, [0, -1]]]}
        board_offset: default
      bend: 0
    pin_names:
      1: 3V3
      2: PC13
      3: PC14
      4: PC15
      5: PA0
      6: PA1
      7: PA2
      8: PA3
      9: PA4
      10: PA5
      11: PA6
      12: PA7
      13: PB0
      14: PB1
      15: PB2/BOOT1
      16: PB10
      17: PB11
      18: NRST
      19: GND
      20: 5V
      21: 3V3
      22: GND
      23: PB9
      24: PB8
      25: PB7
      26: PB6
      27: PB5
      28: PB4
      29: PB3
      30: PA15
