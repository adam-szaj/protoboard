components:
  # One generic resistor — value and body are chosen per placed part.  The
  # footprints: list offers the standard axial through-hole bodies (DIN sizes,
  # the default 1/4 W DIN-0207 first) and the rigid SMD chips; the picker forces
  # the choice at place time (label "R_<name>").  The axial default keeps the
  # bendable second lead; the SMD bodies are rigid (their family fixes the pad
  # spacing) — applied per-footprint when one is chosen.
  - name: R
    description: "Resistor — pick the body, set the value when placing"
    component_class: resistor
    symbol: R
    pins: {count: 2}
    pin_names: {}
    default_value: "?"
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 23
        default: {x: 0, y: 4}
    footprints:
      - {name: DIN-0207, ref: "DIN-0207/typ"}   # 1/4 W axial (default)
      - {name: DIN-0204, ref: "DIN-0204/typ"}   # smaller axial
      - {name: DIN-0411, ref: "DIN-0411/typ"}   # bigger axial
      - {name: DIN-0617, ref: "DIN-0617/typ"}   # power axial
      - {name: SMD-0805, ref: "SMD-0805/typ"}   # rigid chip
      - {name: SMD-0603, ref: "SMD-0603/typ"}   # rigid chip
    aliases:
      # KiCAD footprint strings (axial + SMD) → this generic resistor.
      - R_1206_3216Metric
      - R_2010_5025Metric
      - R_2512_6332Metric
      - R_2816_7142Metric_Pad3_20x4_45mm_HandSolder
      - R_Axial_DIN0207
      - R_Axial_DIN0204
      - R_Axial_DIN0411
      - R_Axial_DIN0617
      - R_0805_2012Metric
      - R_0603_1608Metric

  - name: R_Net_4
    description: "4-resistor SIL network (common bus pin 1)"
    component_class: resistor
    footprint: {type: SIL, pins: 5}
    pin_names: {1: COM, 2: R1, 3: R2, 4: R3, 5: R4}
    default_value: "?"

  - name: R_Net_8
    description: "8-resistor SIL network (common bus pin 1)"
    component_class: resistor
    footprint: {type: SIL, pins: 9}
    pin_names: {1: COM, 2: R1, 3: R2, 4: R3, 5: R4, 6: R5, 7: R6, 8: R7, 9: R8}
    default_value: "?"

  - name: Pot
    description: "Potentiometer / trimmer (3-pin)"
    component_class: resistor
    footprint: {type: SIL, pins: 3}
    pin_names: {1: "1", 2: W, 3: "3"}
    default_value: "?"
