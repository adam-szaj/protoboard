components:
  - name: SW_Push
    description: "Tactile push button (4-pin, standard)"
    component_class: switch
    pins: {count: 4}
    pin_names: { 1: A, 2: A, 3: B, 4: B }
    package:
      shape: prism
      dims:
          ly: 9.5
          lx: 9.5
          lz: 4
      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[0, 2], [3,0], [0, -2]]}
        board_offset: default
      bend: 0

  - name: SW_SPDT
    description: "SPDT toggle switch"
    component_class: switch
    pins: {count: 3}
    pin_names: {1: nc, 2: com, 3: no}
    package:
      shape: prism
      dims: {ly: 3.5, lx: 8.5, lz: 10}
      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[0, 1], [0,1]]}
        board_offset: default
      bend: 0

  - name: SW_SPST
    description: "SPST toggle switch"
    component_class: switch
    pins: {count: 2}
    package:
      shape: prism
      dims: {ly: 3.5, lx: 8.5, lz: 10}
      leads:
        direction: [0, 0, -1]
        body_offset: {unit: 2.5, value: [[0, 1]]}
        board_offset: default
      bend: 0
    pin_names: {1: A, 2: B}

  - name: SW_DPST
    description: "DPST switch (4-pin: two independent SPST)"
    component_class: switch
    pins: {count: 4}
    package: {kind: dip_switch}
    pin_names: {1: A1, 2: B1, 3: A2, 4: B2}

  - name: SW_DPDT
    description: "DPDT switch (6-pin: two independent SPDT)"
    component_class: switch
    pins: {count: 6}
    package: {kind: sil}
    pin_names: {1: COM1, 2: NC1, 3: NO1, 4: COM2, 5: NC2, 6: NO2}

  - name: SW_DIP_4
    description: "4-position DIP switch"
    component_class: switch
    pins: {count: 8}
    package: {kind: dip_switch}
    pin_names: {1: S1A, 2: S2A, 3: S3A, 4: S4A, 5: S4B, 6: S3B, 7: S2B, 8: S1B}
