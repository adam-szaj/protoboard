components:
  # -----------------------------------------------------------------------
  # Templates — CMOS 4000-series supply pins follow DIP package standard:
  # VDD = pin N (last), VSS = pin N/2+1 (centre of second row)
  # -----------------------------------------------------------------------

  - name: _DIP14_IC
    component_class: ic
    footprint: {type: DIP, pins: 14}
    pin_names: {7: VSS, 14: VDD}

  - name: _DIP16_IC
    component_class: ic
    footprint: {type: DIP, pins: 16}
    pin_names: {8: VSS, 16: VDD}

  # -----------------------------------------------------------------------
  # Logic gates
  # -----------------------------------------------------------------------

  - name: CD4001
    extends: _DIP14_IC
    description: "Quad 2-input NOR gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: Y2
      5: A2
      6: B2
      7: VSS
      8: Y3
      9: A3
      10: B3
      11: B4
      12: A4
      13: Y4
      14: VDD

  - name: CD4011
    extends: _DIP14_IC
    description: "Quad 2-input NAND gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: Y2
      5: A2
      6: B2
      7: VSS
      8: Y3
      9: A3
      10: B3
      11: B4
      12: A4
      13: Y4
      14: VDD

  - name: CD4069
    extends: _DIP14_IC
    description: "Hex inverter (NOT gate)"
    pin_names:
      1: A1
      2: Y1
      3: A2
      4: Y2
      5: A3
      6: Y3
      7: VSS
      8: Y4
      9: A4
      10: Y5
      11: A5
      12: Y6
      13: A6
      14: VDD

  - name: CD4081
    extends: _DIP14_IC
    description: "Quad 2-input AND gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: Y2
      5: A2
      6: B2
      7: VSS
      8: Y3
      9: A3
      10: B3
      11: B4
      12: A4
      13: Y4
      14: VDD

  - name: CD4071
    extends: _DIP14_IC
    description: "Quad 2-input OR gate"
    pin_names:
      1: A1
      2: B1
      3: Y1
      4: Y2
      5: A2
      6: B2
      7: VSS
      8: Y3
      9: A3
      10: B3
      11: B4
      12: A4
      13: Y4
      14: VDD

  # -----------------------------------------------------------------------
  # Flip-flops / latches
  # -----------------------------------------------------------------------

  - name: CD4013
    extends: _DIP14_IC
    description: "Dual D flip-flop"
    pin_names:
      1: Q1
      2: NQ1
      3: CLK1
      4: R1
      5: D1
      6: S1
      7: VSS
      8: S2
      9: D2
      10: R2
      11: CLK2
      12: NQ2
      13: Q2
      14: VDD

  - name: CD4017
    extends: _DIP16_IC
    description: "Johnson decade counter / divider"
    pin_names:
      1: Q5
      2: Q1
      3: Q0
      4: Q2
      5: Q6
      6: Q7
      7: Q3
      8: VSS
      9: Q8
      10: Q4
      11: Q9
      12: CARRY
      13: CLK_EN
      14: CLK
      15: RST
      16: VDD

  - name: CD4040
    extends: _DIP16_IC
    description: "12-bit binary ripple counter"
    pin_names:
      1: Q12
      2: Q6
      3: Q5
      4: Q7
      5: Q4
      6: Q3
      7: Q2
      8: VSS
      9: Q1
      10: RST
      11: CLK
      12: Q11
      13: Q10
      14: Q8
      15: Q9
      16: VDD

  # -----------------------------------------------------------------------
  # Analog / mixed
  # -----------------------------------------------------------------------

  - name: CD4016
    extends: _DIP14_IC
    description: "Quad bilateral switch"
    pin_names:
      1: IN_A
      2: OUT_A
      3: CTRL_A
      4: CTRL_B
      5: OUT_B
      6: IN_B
      7: VSS
      8: IN_C
      9: OUT_C
      10: CTRL_C
      11: CTRL_D
      12: OUT_D
      13: IN_D
      14: VDD

  - name: CD4051
    extends: _DIP16_IC
    description: "Single 8-channel analog multiplexer"
    pin_names:
      1: Y
      2: Z
      3: Y4
      4: Y6
      5: Y2
      6: Y1
      7: Y5
      8: VSS
      9: INH
      10: VEE
      11: A
      12: B
      13: C
      14: Y3
      15: Y0
      16: VDD
