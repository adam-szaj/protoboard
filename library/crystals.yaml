components:
  # -----------------------------------------------------------------------
  # Templates
  # -----------------------------------------------------------------------

  - name: _XTAL_HC49
    component_class: crystal
    footprint: {type: SIL, pins: 2}
    pin_names: {1: "1", 2: "2"}

  - name: _OSC_DIP14
    component_class: crystal
    footprint: {type: DIP, pins: 14}
    pin_names: {1: NC, 7: GND, 8: OUT, 14: VCC}

  # -----------------------------------------------------------------------
  # Crystals (HC-49/U through-hole)
  # -----------------------------------------------------------------------

  - name: XTAL_4MHz
    extends: _XTAL_HC49
    description: "Crystal 4 MHz HC-49/U"

  - name: XTAL_8MHz
    extends: _XTAL_HC49
    description: "Crystal 8 MHz HC-49/U"

  - name: XTAL_10MHz
    extends: _XTAL_HC49
    description: "Crystal 10 MHz HC-49/U"

  - name: XTAL_16MHz
    extends: _XTAL_HC49
    description: "Crystal 16 MHz HC-49/U"

  - name: XTAL_20MHz
    extends: _XTAL_HC49
    description: "Crystal 20 MHz HC-49/U"

  # -----------------------------------------------------------------------
  # Oscillator modules (DIP-14 footprint, full-can)
  # -----------------------------------------------------------------------

  - name: OSC_1MHz
    extends: _OSC_DIP14
    description: "Oscillator module 1 MHz DIP-14"

  - name: OSC_4MHz
    extends: _OSC_DIP14
    description: "Oscillator module 4 MHz DIP-14"
