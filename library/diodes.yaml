components:
  # -----------------------------------------------------------------------
  # Templates
  # -----------------------------------------------------------------------

  - name: _DO35
    component_class: diode
    footprint: {type: SIL, pins: 2}
    pin_names: {1: A, 2: K}

  - name: _DO41
    component_class: diode
    footprint: {type: SIL, pins: 2}
    pin_names: {1: A, 2: K}

  - name: _DO35_Z
    component_class: diode_zener
    footprint: {type: SIL, pins: 2}
    pin_names: {1: A, 2: K}

  - name: _LED_T1_75
    component_class: diode_led
    footprint: {type: SIL, pins: 2}
    pin_names: {1: A, 2: K}

  # -----------------------------------------------------------------------
  # Rectifier / switching diodes
  # -----------------------------------------------------------------------

  - name: 1N4148
    extends: _DO35
    description: "Small signal switching diode, 100V 200mA"

  - name: 1N4007
    extends: _DO41
    description: "Rectifier diode, 1000V 1A"

  - name: 1N4001
    extends: _DO41
    description: "Rectifier diode, 50V 1A"

  - name: 1N5819
    extends: _DO41
    description: "Schottky diode, 40V 1A"

  - name: BAT43
    extends: _DO35
    description: "Schottky signal diode, 30V 200mA"

  # -----------------------------------------------------------------------
  # Zener diodes
  # -----------------------------------------------------------------------

  - name: BZX55C3V3
    extends: _DO35_Z
    description: "Zener 3.3V 500mW"

  - name: BZX55C5V1
    extends: _DO35_Z
    description: "Zener 5.1V 500mW"

  - name: BZX55C12
    extends: _DO35_Z
    description: "Zener 12V 500mW"

  - name: 1N4733A
    extends: _DO41
    component_class: diode_zener
    pin_names: {1: A, 2: K}
    description: "Zener 5.1V 1W"

  # -----------------------------------------------------------------------
  # LEDs (T-1 3/4, through-hole)
  # -----------------------------------------------------------------------

  - name: LED_Red
    extends: _LED_T1_75
    description: "LED 5mm red"

  - name: LED_Green
    extends: _LED_T1_75
    description: "LED 5mm green"

  - name: LED_Yellow
    extends: _LED_T1_75
    description: "LED 5mm yellow"

  - name: LED_Blue
    extends: _LED_T1_75
    description: "LED 5mm blue"

  - name: LED_White
    extends: _LED_T1_75
    description: "LED 5mm white"
