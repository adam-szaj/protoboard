  - name: ATmega328P
    component_class: ic
    footprint: {type: DIP, pins: 28}
    description: "AVR 8-bit MCU, 32kB flash (Arduino Uno core)"
    pin_names:
      1: PC6
      2: PD0
      3: PD1
      4: PD2
      5: PD3
      6: PD4
      7: VCC
      8: GND
      9: PB6
      10: PB7
      11: PD5
      12: PD6
      13: PD7
      14: PB0
      15: PB1
      16: PB2
      17: PB3
      18: PB4
      19: PB5
