components:
  # -----------------------------------------------------------------------
  # Timers
  # -----------------------------------------------------------------------

  - name: NE555
    component_class: ic
    footprint: {type: DIP, pins: 8}
    description: "555 timer IC"
    pin_names:
      1: GND
      2: TRIG
      3: OUT
      4: NRST
      5: CTRL
      6: THR
      7: DIS
      8: VCC

  - name: NE556
    component_class: ic
    footprint: {type: DIP, pins: 14}
    description: "Dual 555 timer IC"
    pin_names:
      1: DIS_A
      2: THR_A
      3: CTRL_A
      4: NRST_A
      5: OUT_A
      6: TRIG_A
      7: GND
      8: TRIG_B
      9: OUT_B
      10: NRST_B
      11: CTRL_B
      12: THR_B
      13: DIS_B
      14: VCC

  # -----------------------------------------------------------------------
  # Interface / drivers
  # -----------------------------------------------------------------------

  - name: MAX232
    component_class: ic
    footprint: {type: DIP, pins: 16}
    description: "RS-232 dual driver/receiver, 5V single supply"
    pin_names:
      1: C1+
      2: VS+
      3: C1-
      4: C2+
      5: C2-
      6: VS-
      7: T2OUT
      8: R2IN
      9: R2OUT
      10: T2IN
      11: T1IN
      12: R1OUT
      13: R1IN
      14: T1OUT
      15: GND
      16: VCC

  - name: ULN2003
    component_class: ic
    footprint: {type: DIP, pins: 16}
    description: "7-channel Darlington transistor array"
    pin_names:
      1: IN1
      2: IN2
      3: IN3
      4: IN4
      5: IN5
      6: IN6
      7: IN7
      8: GND
      9: COM
      10: OUT7
      11: OUT6
      12: OUT5
      13: OUT4
      14: OUT3
      15: OUT2
      16: OUT1

  - name: L293D
    component_class: ic
    footprint: {type: DIP, pins: 16}
    description: "Dual H-bridge motor driver, 600mA"
    pin_names:
      1: EN1
      2: IN1
      3: OUT1
      4: GND
      5: GND
      6: OUT2
      7: IN2
      8: VCC2
      9: EN2
      10: IN3
      11: OUT3
      12: GND
      13: GND
      14: OUT4
      15: IN4
      16: VCC1

  # -----------------------------------------------------------------------
  # Microcontrollers (popular DIY packages)
  # -----------------------------------------------------------------------

  - name: ATmega328P
    component_class: ic
    footprint: {type: DIP, pins: 28}
    description: "AVR 8-bit MCU, 32kB flash (Arduino Uno core)"
    pin_names:
      1: PC6
      2: PD0
      3: PD1
      4: PD2
      5: PD3
      6: PD4
      7: VCC
      8: GND
      9: PB6
      10: PB7
      11: PD5
      12: PD6
      13: PD7
      14: PB0
      15: PB1
      16: PB2
      17: PB3
      18: PB4
      19: PB5
      20: AVCC
      21: AREF
      22: GND
      23: PC0
      24: PC1
      25: PC2
      26: PC3
      27: PC4
      28: PC5

  - name: ATtiny85
    component_class: ic
    footprint: {type: DIP, pins: 8}
    description: "AVR 8-bit MCU, 8kB flash (DIP-8)"
    pin_names:
      1: PB5
      2: PB3
      3: PB4
      4: GND
      5: PB0
      6: PB1
      7: PB2
      8: VCC

  - name: PIC16F628A
    component_class: ic
    footprint: {type: DIP, pins: 18}
    description: "PIC 8-bit MCU, 2kB flash"
    pin_names:
      1: RA2
      2: RA3
      3: RA4
      4: NRST
      5: GND
      6: RB0
      7: RB1
      8: RB2
      9: RB3
      10: RB4
      11: RB5
      12: RB6
      13: RB7
      14: VCC
      15: RA6
      16: RA7
      17: RA0
      18: RA1

  # -----------------------------------------------------------------------
  # EEPROMs / memory
  # -----------------------------------------------------------------------

  - name: AT24C02
    component_class: ic
    footprint: {type: DIP, pins: 8}
    description: "2kbit I2C EEPROM"
    pin_names:
      1: A0
      2: A1
      3: A2
      4: GND
      5: SDA
      6: SCL
      7: WP
      8: VCC

  - name: 28C256
    component_class: ic
    footprint: {type: DIP, pins: 28}
    description: "256kbit parallel EEPROM"
    pin_names:
      1: A14
      2: A12
      3: A7
      4: A6
      5: A5
      6: A4
      7: A3
      8: A2
      9: A1
      10: A0
      11: IO0
      12: IO1
      13: IO2
      14: GND
      15: IO3
      16: IO4
      17: IO5
      18: IO6
      19: IO7
      20: NCE
      21: A10
      22: NOE
      23: A11
      24: A9
      25: A8
      26: A13
      27: NWE
      28: VCC

  # -----------------------------------------------------------------------
  # Optocouplers
  # -----------------------------------------------------------------------

  - name: PC817
    component_class: ic
    footprint: {type: DIP, pins: 4}
    description: "Single optocoupler, CTR 50-300%"
    pin_names:
      1: A
      2: K
      3: E
      4: C
