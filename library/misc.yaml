  - name: STM32G4_WeAct
    description: "WeAct STM32G431/G474 CoreBoard (4×20, col_spacings [1,8,1])"
    component_class: ic
    footprint: {type: QuadRow, n_per_col: 20, col_spacings: [1, 8, 1]}
    pin_names:
      # L_outer (col 0), pins 1-20, top→bottom
      1: VBAT
      2: PC13
      3: PC14
      4: PC15
      5: PF0
      6: PF1
      7: NRST
      8: PC0
      9: PC1
      10: PC2
      11: PC3
      12: PA0
      13: PA1
      14: PA2
      15: PA3
      16: PF2
      17: PA4
      18: PA5
      19: PA6
      20: PA7
      # L_inner (col 1), pins 21-40, top→bottom
      21: 3V3
      22: 3V3
      23: BOOT0
      24: SWDIO
      25: SWDCLK
      26: PB3/SWO
      27: GND
      28: GND
      29: PB4
      30: PB5
      31: PB6
      32: PB7
      33: PB8
      34: PB9
      35: GND
      36: GND
      37: 5V
      38: 5V
      39: VBUS
      40: GND
      # R_inner (col 2, x=9), pins 41-60, bottom→top
      41: PB14
      42: PB15
      43: PA8
      44: PA9
      45: PA10
      46: PA11
      47: PA12
      48: PA13
      49: PA14
      50: PA15
      51: PB3
      52: PB4
      53: PB5
      54: PB6
      55: PB7
      56: PB8
      57: PB9
      58: PB10
      59: PB11
      60: PB12
      # R_outer (col 3, x=10), pins 61-80, bottom→top
      61: PC6
      62: PC7
      63: PC8
      64: PC9
      65: PC10
      66: PC11
      67: PC12
      68: PD2
      69: PE0
      70: PE1
      71: PE2
      72: PE3
      73: PE4
      74: PE5
      75: PE6
      76: PE7
      77: PE8
      78: PE9
      79: PE10
      80: PE11
    aliases:
      - STM32G431_WeAct
      - STM32G474_WeAct

  # -----------------------------------------------------------------------
