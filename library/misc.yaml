  # STM32 BluePill (STM32F103C8T6)
  # PCB: 53mm × 22.86mm, 2×20 pins, pitch 2.54mm, rows_spacing 8 (20.32mm)
  # Pinout: left col top→bottom = pins 1-20, right col bottom→top = pins 21-40.
  # Pin 1 = VBAT (top-left), matches standard WeAct/RobotDyn silkscreen.
  - name: STM32_BluePill
    description: "STM32F103C8T6 Blue Pill module (2×20, 20.32mm wide)"
    component_class: ic
    footprint: {type: DIP, pins: 40, rows_spacing: 7}
    pin_names:
      1: VBAT
      2: PC13
      3: PC14
      4: PC15
      5: PA0
      6: PA1
      7: PA2
      8: PA3
      9: PA4
      10: PA5
      11: PA6
      12: PA7
      13: PB0
      14: PB1
      15: PB10
      16: PB11
      17: NRST
      18: 3V3
      19: GND
      20: GND
      21: 3V3
      22: GND
      23: 5V
      24: PB9
      25: PB8
      26: PB7
      27: PB6
      28: PB5
      29: PB4
      30: PB3
      31: PA15
      32: PA12
      33: PA11
      34: PA10
      35: PA9
      36: PA8
      37: PB15
      38: PB14
      39: PB13
      40: PB12
    aliases:
      - STM32F103C8T6_BluePill
      - BluePill

  # STM32 BlackPill (STM32F401CEU6 / STM32F411CEU6)
  # PCB: 52.8mm × 20.8mm, 2×20 pins, pitch 2.54mm, rows_spacing 7 (17.78mm)
  # WeAct Studio v3.0+ pinout. STM32F401 and STM32F411 share identical pinout.
  # Pin 1 = 3V3 (top-left), pin 20 = B9, pin 21 = GND, pin 40 = B12.
  - name: STM32_BlackPill
    description: "STM32F401/F411 Black Pill module (2×20, 17.78mm wide)"
    component_class: ic
    footprint: {type: DIP, pins: 40, rows_spacing: 7}
    pin_names:
      1: 3V3
      2: PC13
      3: PC14
      4: PC15
      5: PA0
      6: PA1
      7: PA2
      8: PA3
      9: PA4
      10: PA5
      11: PA6
      12: PA7
      13: PB0
      14: PB1
      15: PB2/BOOT1
      16: PB10
      17: PB11
      18: NRST
      19: GND
      20: 5V
      21: 3V3
      22: GND
      23: PB9
      24: PB8
      25: PB7
      26: PB6
      27: PB5
      28: PB4
      29: PB3
      30: PA15
      31: PA12
      32: PA11
      33: PA10
      34: PA9
      35: PA8
      36: PB15
      37: PB14
      38: PB13
      39: PB12
      40: VBAT
    aliases:
      - STM32F401_BlackPill
      - STM32F411_BlackPill
      - BlackPill

  # WeAct STM32G431/G474 CoreBoard
