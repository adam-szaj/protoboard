components:
  # -----------------------------------------------------------------------
  # Resistors
  # -----------------------------------------------------------------------

  # Axial resistor — pin 2 swings from 1 raster (vertical mount) up to 23.
  # Renderer auto-detects horizontal vs vertical from the actual pin spacing.
  - name: R
    description: "Resistor (axial through-hole)"
    component_class: resistor
    footprint: {type: SIL, pins: 2}
    pin_names: {}
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 23
        default: {x: 0, y: 4}

  - name: R_Net_4
    description: "4-resistor SIL network (common bus pin 1)"
    component_class: resistor
    footprint: {type: SIL, pins: 5}
    pin_names: {1: COM, 2: R1, 3: R2, 4: R3, 5: R4}

  - name: R_Net_8
    description: "8-resistor SIL network (common bus pin 1)"
    component_class: resistor
    footprint: {type: SIL, pins: 9}
    pin_names: {1: COM, 2: R1, 3: R2, 4: R3, 5: R4, 6: R5, 7: R6, 8: R7, 9: R8}

  - name: Pot
    description: "Potentiometer / trimmer (3-pin)"
    component_class: resistor
    footprint: {type: SIL, pins: 3}
    pin_names: {1: "1", 2: W, 3: "3"}

  # -----------------------------------------------------------------------
  # Capacitors
  # -----------------------------------------------------------------------

  - name: C
    description: "Capacitor (radial, non-polar, variable pitch)"
    component_class: capacitor_nonpolar
    footprint: {type: SIL, pins: 2}
    pin_names: {}
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 5
        default: {x: 0, y: 1}

  - name: C_POL
    description: "Capacitor (electrolytic, polar, variable pitch)"
    component_class: capacitor_polar
    footprint: {type: SIL, pins: 2}
    pin_names: {1: "+", 2: "-"}
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 5
        default: {x: 0, y: 1}

  - name: C_Disc
    description: "Disc ceramic capacitor (variable pitch)"
    component_class: capacitor_nonpolar
    footprint: {type: SIL, pins: 2}
    pin_names: {}
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 3
        default: {x: 0, y: 1}

  # -----------------------------------------------------------------------
  # Inductors / transformers
  # -----------------------------------------------------------------------

  - name: L
    description: "Inductor (axial/radial, variable pitch)"
    component_class: inductor
    footprint: {type: SIL, pins: 2}
    pin_names: {}
    bendable_pins:
      2:
        min_reach: 1
        max_reach: 7
        default: {x: 0, y: 1}

  - name: T
    description: "Transformer (4-pin: primary + secondary)"
    component_class: transformer
    footprint: {type: DIP, pins: 4}
    pin_names: {1: P1, 2: P2, 3: S1, 4: S2}

  # -----------------------------------------------------------------------
  # Fuses
  # -----------------------------------------------------------------------

  - name: F
    description: "Fuse (glass tube, PCB holder)"
    component_class: fuse
    footprint: {type: SIL, pins: 2}
    pin_names: {1: A, 2: B}
    bendable_pins:
      2:
        min_reach: 3
        max_reach: 9
        default: {x: 0, y: 3}

  # -----------------------------------------------------------------------
  # Switches
  # -----------------------------------------------------------------------

  - name: SW_Push
    description: "Tactile push button (4-pin, standard)"
    component_class: switch
    footprint: {type: DIP, pins: 4}
    pin_names: {1: A1, 2: A2, 3: B1, 4: B2}

  - name: SW_SPDT
    description: "SPDT slide/toggle switch"
    component_class: switch
    footprint: {type: SIL, pins: 3}
    pin_names: {1: COM, 2: NC, 3: NO}

  - name: SW_DIP_4
    description: "4-position DIP switch"
    component_class: switch
    footprint: {type: DIP, pins: 8}
    pin_names: {1: S1A, 2: S2A, 3: S3A, 4: S4A, 5: S4B, 6: S3B, 7: S2B, 8: S1B}
