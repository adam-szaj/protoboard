components:
  # -----------------------------------------------------------------------
  # Templates (prefix _ → not placeable)
  # -----------------------------------------------------------------------

  # TO-92: each lead can be bent ±1 raster left/right.
  # Offsets are in the component local frame (before rotation).
  - name: _NPN
    component_class: transistor_npn
    footprint: {type: TO92}
    pin_names: {}
    bendable_pins:
      1: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]
      2: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]
      3: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]

  - name: _PNP
    component_class: transistor_pnp
    footprint: {type: TO92}
    pin_names: {}
    bendable_pins:
      1: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]
      2: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]
      3: [{x: 0, y: 0}, {x: -1, y: 0}, {x: 1, y: 0}]

  - name: _TO92_NPN_CBE
    extends: _NPN
    pin_names: {1: C, 2: B, 3: E}

  - name: _TO92_NPN_BCE
    extends: _NPN
    pin_names: {1: B, 2: C, 3: E}

  - name: _TO92_NPN_EBC
    extends: _NPN
    pin_names: {1: E, 2: B, 3: C}

  - name: _TO92_PNP_CBE
    extends: _PNP
    pin_names: {1: C, 2: B, 3: E}

  - name: _TO92_PNP_EBC
    extends: _PNP
    pin_names: {1: E, 2: B, 3: C}

  # -----------------------------------------------------------------------
  # NPN BJT
  # -----------------------------------------------------------------------

  - name: BC547
    extends: _TO92_NPN_CBE
    description: "NPN 45V 0.1A general purpose"

  - name: BC548
    extends: _TO92_NPN_CBE
    description: "NPN 30V 0.1A general purpose"

  - name: BC549
    extends: _TO92_NPN_CBE
    description: "NPN 30V 0.1A low noise"

  - name: 2N2222
    extends: _TO92_NPN_CBE
    description: "NPN 40V 0.6A switching"

  - name: 2N3904
    extends: _TO92_NPN_EBC
    description: "NPN 40V 0.2A general purpose"

  - name: BC337
    extends: _TO92_NPN_BCE
    description: "NPN 45V 0.8A medium power"

  # -----------------------------------------------------------------------
  # PNP BJT
  # -----------------------------------------------------------------------

  - name: BC557
    extends: _TO92_PNP_CBE
    description: "PNP 45V 0.1A general purpose"

  - name: BC558
    extends: _TO92_PNP_CBE
    description: "PNP 30V 0.1A general purpose"

  - name: 2N3906
    extends: _TO92_PNP_EBC
    description: "PNP 40V 0.2A general purpose"

  # -----------------------------------------------------------------------
  # Generic 3-pin packages — placeholders for KiCAD-imported transistors
  # whose exact pin ordering is unknown at import time.
  # -----------------------------------------------------------------------

  - name: Q_SOT23
    description: "Generic SOT-23 transistor (3-pin SMD, treated as SIL)"
    component_class: transistor_npn
    footprint: {type: SIL, pins: 3}
    pin_names: {1: "1", 2: "2", 3: "3"}
    aliases:
      - SOT_23
      - SOT-23

  - name: Q_TO126
    description: "Generic TO-126 transistor (3-pin THT)"
    component_class: transistor_npn
    footprint: {type: SIL, pins: 3}
    pin_names: {1: "1", 2: "2", 3: "3"}
    aliases:
      - TO_126_3_Vertical
      - TO-126-3

  - name: Q_TO92
    description: "Generic TO-92 transistor (pin order unknown)"
    component_class: transistor_npn
    footprint: {type: TO92}
    pin_names: {1: "1", 2: "2", 3: "3"}
    aliases:
      - TO_92_Inline
      - TO-92_Inline
