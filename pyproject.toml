[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protoboard-designer"
version = "0.1.0"
description = "Connectivity-aware perfboard/stripboard layout designer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam Szaj", email = "adam.szaj@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.1",
    "networkx>=3.3",
    "ruamel.yaml>=0.18",
    "structlog>=24.0",
]

[project.optional-dependencies]
# Dev tooling is pinned to exact versions so the test suite, type checker and
# formatter run identically across machines / worktrees (a stale editable
# install once silently pointed at the wrong worktree — pinning removes the
# matching ambiguity for the tools themselves). Bump deliberately.
dev = [
    "pytest==9.1.0",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.6.1",
    "mypy==2.1.0",
    "ruff==0.15.17",
    "black==26.5.1",
    "pre-commit==4.6.0",
    "hypothesis==6.155.2",
    "pytest-benchmark==5.2.3",
    "maturin==1.14.0",
    "pyinstaller==6.21.0",
]

[project.scripts]
protoboard = "protoboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protoboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not property and not slow'"
markers = [
    "property: hypothesis-driven property tests (skipped by default; run with -m property)",
    "serial: wall-time-sensitive tests that must run in a single, unloaded process (excluded from the parallel '-n auto' run; see docs/testing.md)",
    "slow: very slow benchmarks (>30 s) skipped by default; run with -m slow (see docs/testing.md)",
]


[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.black]
target-version = ["py311"]
line-length = 88

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "py-spy>=0.4.2",
    "snakeviz>=2.2.2",
]
