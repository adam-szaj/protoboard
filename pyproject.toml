[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protoboard-designer"
version = "0.1.0"
description = "Connectivity-aware perfboard/stripboard layout designer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam Szaj", email = "adam.szaj@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.1",
    "networkx>=3.3",
    "ruamel.yaml>=0.18",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "maturin>=1.0",
]

[project.scripts]
protoboard = "protoboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protoboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"


[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.black]
target-version = ["py311"]
line-length = 88

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "py-spy>=0.4.2",
    "snakeviz>=2.2.2",
]
