[package]
name = "protoboard-astar-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "protoboard_astar_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
